<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Taka // Expense Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neo: {
                            bg: '#f0fdf4',
                            dark: '#020617', /* very dark slate/black */
                            card: '#ffffff',
                            cardDark: '#1e293b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Space Grotesk Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react@0.395.0/dist/umd/lucide.js"></script>
    <style>
        /* Soft Neo-Brutalism Custom Styles */
        body {
            font-family: 'Space Grotesk', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Default Hard Shadow (Light Mode) */
        .shadow-neo {
            box-shadow: 4px 4px 0px 0px #000000;
        }
        .shadow-neo-sm {
            box-shadow: 2px 2px 0px 0px #000000;
        }
        .shadow-neo-lg {
             box-shadow: 8px 8px 0px 0px #000000;
        }
        
        /* Smooth Transitions */
        .transition-neo {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Button Press Effect */
        .btn-neo {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s;
            cursor: pointer;
        }
        .btn-neo:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px currentColor; /* Dynamic in dark mode */
        }

        /* Slide Animations */
        .slide-overlay {
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            opacity: 0;
        }
        .slide-overlay.open {
            pointer-events: auto;
            opacity: 1;
        }

        .slide-sheet {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Smooth ease-out */
            transform: translateY(100%);
        }
        .slide-sheet.open {
            transform: translateY(0);
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #15803d; /* Green scrollbar in dark mode */
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            accent-color: #000;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .dark input[type="checkbox"] {
            accent-color: #15803d;
        }
        
        /* FAB Pulse */
        @keyframes fabPulse {
            0% { box-shadow: 4px 4px 0px 0px currentColor; }
            50% { box-shadow: 6px 6px 0px 0px currentColor; transform: translateY(-2px); }
            100% { box-shadow: 4px 4px 0px 0px currentColor; }
        }
        .fab-animate {
            animation: fabPulse 2s infinite;
        }

        /* Modal Animation */
        .modal-scale {
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .modal-scale.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* --- DARK MODE OVERRIDES --- */
        /* We want a Green Shadow in Dark Mode */
        .dark .shadow-neo, 
        .dark .shadow-neo-sm, 
        .dark .shadow-neo-lg {
             box-shadow: 4px 4px 0px 0px #15803d; /* Green-700 */
             border-color: #22c55e; /* Green-500 Border for high contrast */
        }
        
        .dark .fab-animate {
            box-shadow: 4px 4px 0px 0px #15803d;
        }
        
        .dark .btn-neo:active {
            box-shadow: 2px 2px 0px 0px #15803d;
        }

        /* Dark Mode Text Input Overrides */
        .dark input, .dark select {
            border-color: #22c55e;
        }

        /* Tab Active State Colors handled in JS/Tailwind classes */
    </style>
</head>
<body class="bg-green-50 dark:bg-black text-black dark:text-green-50 min-h-screen pb-24 transition-colors duration-300 selection:bg-green-300 selection:text-black">

    <!-- Main App Container -->
    <div class="max-w-lg mx-auto bg-white dark:bg-black min-h-screen border-x-4 border-black dark:border-green-700 relative shadow-2xl flex flex-col transition-colors duration-300">
        
        <!-- Header -->
        <header class="bg-green-300 dark:bg-green-900 p-6 border-b-4 border-black dark:border-green-600 sticky top-0 z-20 rounded-b-3xl mb-2 transition-all duration-300">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight flex items-center gap-2 dark:text-white">
                        Amar<span class="text-white stroke-black dark:text-green-400" style="-webkit-text-stroke: 1px black;">Taka</span>
                    </h1>
                </div>
                <button id="theme-toggle" class="bg-white dark:bg-black px-3 py-2 border-2 border-black dark:border-green-500 font-bold text-xs shadow-neo-sm rounded-lg hover:bg-gray-100 dark:hover:bg-green-900/30 transition-transform active:scale-95 flex items-center gap-2">
                    <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="moon" class="w-4 h-4 hidden dark:block text-green-400"></i>
                    <span class="dark:text-green-400">MODE</span>
                </button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <div class="px-4 sticky top-[90px] z-10 mb-4">
            <nav class="flex bg-white dark:bg-black border-2 border-black dark:border-green-600 rounded-2xl shadow-neo-sm overflow-hidden p-1 gap-1 transition-colors">
                <button class="tab-btn active flex-1 py-3 font-bold text-sm rounded-xl transition-all duration-200 flex items-center justify-center gap-2" data-tab="dashboard" style="background-color: #4ade80; border: 2px solid black; color: black;">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dash
                </button>
                <button class="tab-btn flex-1 py-3 font-bold text-sm rounded-xl border-2 border-transparent transition-all duration-200 hover:bg-green-100 dark:hover:bg-green-900/30 dark:text-green-400 flex items-center justify-center gap-2" data-tab="transactions">
                    <i data-lucide="list" class="w-4 h-4"></i> List
                </button>
                <button class="tab-btn flex-1 py-3 font-bold text-sm rounded-xl border-2 border-transparent transition-all duration-200 hover:bg-green-100 dark:hover:bg-green-900/30 dark:text-green-400 flex items-center justify-center gap-2" data-tab="manage">
                    <i data-lucide="settings-2" class="w-4 h-4"></i> Settings
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <main class="p-6 flex-1">
            <!-- Dashboard Tab -->
            <div id="dashboard-content" class="tab-content active space-y-8">
                
                <!-- Total Balance Card -->
                <div class="bg-black dark:bg-gray-900 p-6 shadow-neo rounded-3xl relative overflow-hidden text-white transform transition-neo hover:-translate-y-1 border-2 border-transparent dark:border-green-600">
                    <div class="absolute top-4 right-4 bg-white dark:bg-black text-black dark:text-green-400 px-3 py-1 text-xs font-bold rounded-full border-2 border-transparent dark:border-green-600">NET BALANCE</div>
                    <h3 class="text-lg font-bold text-gray-400 dark:text-gray-500 mb-1">Total Available</h3>
                    <p id="total-balance" class="text-5xl font-bold tracking-tighter mb-4">$0.00</p>
                    <div class="flex gap-2 mt-2">
                        <div class="flex-1 bg-gray-900 dark:bg-black rounded-xl p-2 border border-gray-700 dark:border-green-900">
                            <p class="text-xs text-green-400 font-bold flex items-center gap-1"><i data-lucide="trending-up" class="w-3 h-3"></i> INCOME</p>
                            <p id="total-income" class="font-bold text-lg text-green-400">+$0.00</p>
                        </div>
                        <div class="flex-1 bg-gray-900 dark:bg-black rounded-xl p-2 border border-gray-700 dark:border-green-900">
                            <p class="text-xs text-red-400 font-bold flex items-center gap-1"><i data-lucide="trending-down" class="w-3 h-3"></i> EXPENSE</p>
                            <p id="total-expense" class="font-bold text-lg text-red-400">-$0.00</p>
                        </div>
                    </div>
                </div>

                <!-- Wallet Breakdown -->
                <div>
                    <h3 class="text-xl font-bold mb-3 px-1 flex items-center gap-2 dark:text-white">
                        <i data-lucide="wallet-cards" class="w-5 h-5"></i> Wallets
                    </h3>
                    <div class="grid grid-cols-2 gap-3" id="wallet-list">
                        <!-- Wallets injected here via JS -->
                    </div>
                </div>

                <!-- Recent List -->
                <div>
                    <div class="flex justify-between items-end mb-3 px-1">
                        <h3 class="text-xl font-bold dark:text-white flex items-center gap-2"><i data-lucide="history" class="w-5 h-5"></i> Recent Activity</h3>
                    </div>
                    <div id="recent-transactions-list" class="space-y-3">
                         <!-- Recent Transactions injected here -->
                    </div>
                </div>
            </div>

            <!-- Transactions Tab -->
            <div id="transactions-content" class="tab-content space-y-6">
                <div class="flex justify-between items-center px-2">
                    <h3 class="text-2xl font-bold dark:text-white flex items-center gap-2">
                        <i data-lucide="scroll-text" class="w-6 h-6"></i> All History
                    </h3>
                    <span id="tx-count" class="text-xs font-bold bg-gray-200 dark:bg-green-900 dark:text-green-100 border-2 border-black dark:border-green-500 px-3 py-1 rounded-full shadow-neo-sm">0</span>
                </div>
                
                <!-- Search Filter -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-green-600"></i>
                    <input type="text" id="search-input" placeholder="Search transactions..." class="w-full py-3 pl-10 pr-4 rounded-xl border-2 border-black dark:border-green-600 bg-white dark:bg-black focus:outline-none font-bold text-sm dark:text-white shadow-neo-sm placeholder-gray-400 dark:placeholder-gray-600 focus:ring-2 focus:ring-green-400 dark:focus:ring-green-700">
                </div>

                <div id="all-transactions-list" class="space-y-3 pb-12 min-h-[300px]">
                     <!-- All Transactions injected here -->
                     <div class="text-center p-8 text-gray-400 dark:text-gray-600 font-bold">Loading data...</div>
                </div>
            </div>

            <!-- Manage Tab -->
            <div id="manage-content" class="tab-content space-y-8">
                <h3 class="text-2xl font-bold px-2 dark:text-white flex items-center gap-2">
                    <i data-lucide="sliders-horizontal" class="w-6 h-6"></i> Control Panel
                </h3>
                
                <!-- Demo Status -->
                <div class="border-2 border-black dark:border-green-600 bg-white dark:bg-green-950 p-5 shadow-neo rounded-3xl text-black dark:text-green-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold mb-2 uppercase text-xs tracking-widest bg-gray-200 dark:bg-green-900 dark:text-white inline-block px-2 py-1 rounded-md border border-black dark:border-green-500">Data Storage</h4>
                            <p class="font-mono text-sm font-bold">Browser Local Storage</p>
                        </div>
                        <i data-lucide="database" class="w-6 h-6 text-gray-400 dark:text-green-600"></i>
                    </div>
                    <button id="reset-demo-data" class="mt-4 text-xs font-bold bg-gray-50 dark:bg-black border border-black dark:border-green-600 px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 hover:border-red-600 dark:hover:border-red-600 transition-colors flex items-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset to Default Data
                    </button>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <!-- Manage Categories (Green Theme) -->
                    <button id="manage-categories-btn" class="btn-neo w-full bg-white dark:bg-black border-4 border-black dark:border-green-600 text-black dark:text-white py-5 font-bold text-lg hover:bg-green-50 dark:hover:bg-green-900/20 flex items-center justify-center gap-3 shadow-neo rounded-2xl group">
                        <div class="bg-green-100 dark:bg-green-900 p-2 rounded-lg border-2 border-black dark:border-green-500 group-hover:rotate-3 transition-transform">
                             <i data-lucide="tag" class="w-5 h-5 text-green-700 dark:text-green-300"></i>
                        </div>
                        Manage Categories
                        <i data-lucide="chevron-right" class="w-5 h-5 ml-auto opacity-50"></i>
                    </button>

                    <!-- Manage Wallets (Green Theme) -->
                    <button id="manage-wallets-btn" class="btn-neo w-full bg-white dark:bg-black border-4 border-black dark:border-green-600 text-black dark:text-white py-5 font-bold text-lg hover:bg-green-50 dark:hover:bg-green-900/20 flex items-center justify-center gap-3 shadow-neo rounded-2xl group">
                        <div class="bg-green-100 dark:bg-green-900 p-2 rounded-lg border-2 border-black dark:border-green-500 group-hover:-rotate-3 transition-transform">
                            <i data-lucide="wallet" class="w-5 h-5 text-green-700 dark:text-green-300"></i>
                        </div>
                        Manage Wallets
                        <i data-lucide="chevron-right" class="w-5 h-5 ml-auto opacity-50"></i>
                    </button>
                </div>
                
                <div class="mt-8">
                    <h3 class="text-xl font-bold mb-3 px-2 dark:text-white flex items-center gap-2">
                        <i data-lucide="calendar-clock" class="w-5 h-5"></i> Recurring Items
                    </h3>
                    <div id="recurring-payments-list" class="space-y-3">
                        <!-- Recurring items injected via JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-main" class="btn-neo fixed bottom-8 right-6 bg-green-400 dark:bg-green-600 border-4 border-black dark:border-green-400 text-black dark:text-white w-16 h-16 shadow-neo rounded-2xl flex items-center justify-center z-30 fab-animate hover:bg-green-300 dark:hover:bg-green-500 transition-colors">
            <i data-lucide="plus" class="w-8 h-8 stroke-[3]"></i>
        </button>
    </div>

    <!-- --- SLIDE-UP SHEETS & MODALS --- -->

    <!-- Overlay Background -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 dark:bg-black/90 backdrop-blur-sm z-40 slide-overlay"></div>

    <!-- 1. Type Selector Sheet (Spend vs Earn) -->
    <div id="type-selector-sheet" class="fixed bottom-0 left-0 right-0 z-50 p-4 slide-sheet flex justify-center pointer-events-none">
        <div class="bg-white dark:bg-black border-4 border-black dark:border-green-600 shadow-neo rounded-3xl p-6 w-full max-w-lg pointer-events-auto pb-10 relative">
             <!-- Close Handle -->
             <div class="w-12 h-1.5 bg-gray-300 dark:bg-green-900 rounded-full mx-auto mb-6 cursor-pointer hover:bg-gray-400 transition-colors" id="close-selector-handle"></div>
             
             <h2 class="text-2xl font-bold text-center mb-6 dark:text-white">What do you want to do?</h2>
             
             <div class="grid grid-cols-2 gap-4">
                 <button id="btn-choose-income" class="btn-neo flex flex-col items-center justify-center gap-3 p-6 bg-green-100 dark:bg-green-900/20 border-2 border-black dark:border-green-500 rounded-2xl hover:bg-green-200 dark:hover:bg-green-900/40 shadow-neo-sm h-40 group">
                     <div class="w-14 h-14 bg-green-500 border-2 border-black dark:border-green-400 rounded-full flex items-center justify-center text-white shadow-sm group-hover:scale-110 transition-transform">
                        <i data-lucide="arrow-down" class="w-8 h-8 stroke-[3]"></i>
                     </div>
                     <span class="font-bold text-lg dark:text-green-400">Add Income</span>
                 </button>
                 
                 <button id="btn-choose-expense" class="btn-neo flex flex-col items-center justify-center gap-3 p-6 bg-red-100 dark:bg-red-900/20 border-2 border-black dark:border-red-500 rounded-2xl hover:bg-red-200 dark:hover:bg-red-900/40 shadow-neo-sm h-40 group">
                     <div class="w-14 h-14 bg-red-500 border-2 border-black dark:border-red-400 rounded-full flex items-center justify-center text-white shadow-sm group-hover:scale-110 transition-transform">
                        <i data-lucide="arrow-up" class="w-8 h-8 stroke-[3]"></i>
                     </div>
                     <span class="font-bold text-lg dark:text-red-400">Spend Money</span>
                 </button>
             </div>
        </div>
    </div>

    <!-- 2. Add/Edit Transaction Form Sheet -->
    <div id="transaction-sheet" class="fixed bottom-0 left-0 right-0 z-50 p-0 sm:p-4 slide-sheet flex justify-center pointer-events-none h-[90vh]">
        <div class="bg-white dark:bg-black border-t-4 sm:border-4 border-black dark:border-green-600 shadow-neo-lg p-6 w-full max-w-lg pointer-events-auto rounded-t-3xl sm:rounded-3xl flex flex-col relative h-full">
            
            <!-- Header -->
            <div class="flex justify-between items-center mb-6 border-b-2 border-gray-100 dark:border-green-900 pb-4">
                <h2 id="form-title" class="text-2xl font-bold dark:text-white">New Transaction</h2>
                <button id="close-form-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-green-900 rounded-full dark:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Form Scrollable Area -->
            <div class="overflow-y-auto flex-1 pr-2 -mr-2 pb-20">
                <form id="transaction-form" class="space-y-5">
                    <!-- Type (Hidden) -->
                    <input type="hidden" id="transaction-type" value="expense">

                    <!-- Amount Input (Large) -->
                    <div>
                        <label id="amount-label" class="block text-xs font-bold uppercase mb-2 ml-1 text-gray-500 dark:text-gray-400">Amount</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-gray-400">$</span>
                            <input type="number" step="0.01" id="transaction-amount" class="w-full pl-10 pr-4 py-4 border-2 border-black dark:border-green-600 font-bold text-3xl focus:outline-none rounded-2xl transition-all bg-gray-50 dark:bg-black dark:text-white focus:bg-white dark:focus:bg-green-900/20" placeholder="0.00" required>
                        </div>
                    </div>

                    <!-- Wallet Source -->
                    <div>
                        <label class="block text-xs font-bold uppercase mb-2 ml-1 text-gray-500 dark:text-gray-400">Wallet / Method</label>
                        <div class="relative">
                            <select id="transaction-wallet" class="w-full p-4 border-2 border-black dark:border-green-600 font-bold focus:outline-none appearance-none bg-white dark:bg-black dark:text-white rounded-xl transition-all" required>
                                <!-- Wallets populated via JS -->
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-black dark:text-white">
                                <i data-lucide="credit-card" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-bold uppercase mb-2 ml-1 text-gray-500 dark:text-gray-400">Date</label>
                            <input type="date" id="transaction-date" class="w-full p-4 border-2 border-black dark:border-green-600 font-bold focus:outline-none rounded-xl bg-white dark:bg-black dark:text-white" required>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-bold uppercase mb-2 ml-1 text-gray-500 dark:text-gray-400">Category</label>
                            <div class="relative">
                                <select id="transaction-category" class="w-full p-4 border-2 border-black dark:border-green-600 font-bold focus:outline-none appearance-none bg-white dark:bg-black dark:text-white rounded-xl" required>
                                    <option value="">Select...</option>
                                    <!-- Categories populated here -->
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-black dark:text-white">
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase mb-2 ml-1 text-gray-500 dark:text-gray-400">Description</label>
                        <input type="text" id="transaction-note" class="w-full p-4 border-2 border-black dark:border-green-600 font-bold focus:outline-none rounded-xl bg-white dark:bg-black dark:text-white" placeholder="What is this for?" required>
                    </div>

                    <button type="submit" id="save-transaction-btn" class="btn-neo w-full bg-black dark:bg-green-600 text-white dark:text-white border-2 border-black dark:border-green-400 py-4 font-bold text-xl rounded-xl hover:bg-gray-800 dark:hover:bg-green-700 shadow-neo-sm mt-4 flex items-center justify-center gap-2">
                        <i data-lucide="check" class="w-6 h-6"></i> Save Transaction
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div id="categories-modal" class="fixed inset-0 flex items-center justify-center p-4 z-50 hidden modal-scale">
        <div class="absolute inset-0 bg-black/50 dark:bg-black/90 backdrop-blur-sm" id="close-cats-bg"></div>
        <div class="bg-white dark:bg-black border-4 border-black dark:border-green-600 shadow-neo p-6 w-full max-w-md rounded-3xl relative pointer-events-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold border-b-4 border-black dark:border-green-600 inline-block pb-1 px-2 dark:text-white">Categories</h2>
                <button id="close-cats-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-green-900 rounded-full dark:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="category-form" class="flex gap-2 mb-6">
                <input type="text" id="new-category-input" class="flex-1 p-3 border-2 border-black dark:border-green-600 font-bold focus:outline-none rounded-xl shadow-neo-sm bg-white dark:bg-black dark:text-white" placeholder="New Category Name" required>
                <button type="submit" class="btn-neo bg-green-400 dark:bg-green-600 border-2 border-black dark:border-green-400 p-3 hover:bg-green-500 transition-all flex items-center justify-center w-14 rounded-xl shadow-neo-sm">
                    <i data-lucide="plus" class="stroke-[3] text-black dark:text-white"></i>
                </button>
            </form>

            <div class="max-h-60 overflow-y-auto space-y-2 pr-2" id="categories-list-manage">
                <!-- Categories list here -->
            </div>
        </div>
    </div>

    <!-- Manage Wallets Modal -->
    <div id="wallets-modal" class="fixed inset-0 flex items-center justify-center p-4 z-50 hidden modal-scale">
        <div class="absolute inset-0 bg-black/50 dark:bg-black/90 backdrop-blur-sm" id="close-wallets-bg"></div>
        <div class="bg-white dark:bg-black border-4 border-black dark:border-green-600 shadow-neo p-6 w-full max-w-md rounded-3xl relative pointer-events-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold border-b-4 border-black dark:border-green-600 inline-block pb-1 px-2 dark:text-white">Wallets</h2>
                <button id="close-wallets-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-green-900 rounded-full dark:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="wallet-form" class="flex gap-2 mb-6">
                <input type="text" id="new-wallet-input" class="flex-1 p-3 border-2 border-black dark:border-green-600 font-bold focus:outline-none rounded-xl shadow-neo-sm bg-white dark:bg-black dark:text-white" placeholder="New Wallet (e.g. Savings)" required>
                <button type="submit" class="btn-neo bg-green-400 dark:bg-green-600 border-2 border-black dark:border-green-400 p-3 hover:bg-green-500 transition-all flex items-center justify-center w-14 rounded-xl shadow-neo-sm">
                    <i data-lucide="plus" class="stroke-[3] text-black dark:text-white"></i>
                </button>
            </form>

            <div class="max-h-60 overflow-y-auto space-y-2 pr-2" id="wallets-list-manage">
                <!-- Wallets list here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic (No Firebase, LocalStorage Only) -->
    <script>
        // --- Data Management ---
        const DEMO_DATA = {
            wallets: ['Cash', 'Bank', 'PayPal', 'Bkash', 'Nagad'],
            categories: ['Food', 'Transport', 'Salary', 'Entertainment', 'Shopping', 'Bills', 'Health', 'Rent'],
            transactions: [
                { id: 1715400000000, type: 'income', amount: 4500.00, wallet: 'Bank', category: 'Salary', date: '2024-05-01', note: 'Monthly Salary' },
                { id: 1715410000000, type: 'expense', amount: 120.00, wallet: 'Cash', category: 'Food', date: '2024-05-02', note: 'Grocery Shopping' },
                { id: 1715410005000, type: 'expense', amount: 15.00, wallet: 'Bkash', category: 'Transport', date: '2024-05-02', note: 'Rickshaw Fare' },
                { id: 1715420000000, type: 'expense', amount: 250.00, wallet: 'PayPal', category: 'Shopping', date: '2024-05-03', note: 'Online Subscription' },
                { id: 1715430000000, type: 'expense', amount: 60.00, wallet: 'Bank', category: 'Bills', date: '2024-05-05', note: 'Internet Bill' },
                { id: 1715440000000, type: 'income', amount: 500.00, wallet: 'Cash', category: 'Entertainment', date: '2024-05-06', note: 'Freelance Gig' },
                { id: 1715450000000, type: 'expense', amount: 45.50, wallet: 'Nagad', category: 'Food', date: '2024-05-07', note: 'Dinner with friends' },
                { id: 1715460000000, type: 'expense', amount: 1200.00, wallet: 'Bank', category: 'Rent', date: '2024-05-01', note: 'Apartment Rent' },
                { id: 1715470000000, type: 'expense', amount: 30.00, wallet: 'Cash', category: 'Health', date: '2024-05-08', note: 'Medicine' },
                { id: 1715480000000, type: 'income', amount: 100.00, wallet: 'Bkash', category: 'Entertainment', date: '2024-05-09', note: 'Gift' },
                { id: 1715490000000, type: 'expense', amount: 25.00, wallet: 'Cash', category: 'Food', date: '2024-05-10', note: 'Snacks' },
                { id: 1715500000000, type: 'expense', amount: 10.00, wallet: 'Cash', category: 'Transport', date: '2024-05-10', note: 'Bus Ticket' },
                { id: 1715510000000, type: 'income', amount: 250.00, wallet: 'Nagad', category: 'Salary', date: '2024-05-11', note: 'Bonus' },
                { id: 1715520000000, type: 'expense', amount: 80.00, wallet: 'Bank', category: 'Bills', date: '2024-05-12', note: 'Electricity' },
                { id: 1715530000000, type: 'expense', amount: 1500.00, wallet: 'Bank', category: 'Shopping', date: '2024-05-13', note: 'New Phone' }
            ],
            recurring: [
                { id: 1, name: 'Netflix', amount: 12.99, date: '15th', type: 'expense' },
                { id: 2, name: 'Gym Membership', amount: 40.00, date: '1st', type: 'expense' },
                { id: 3, name: 'Spotify', amount: 9.99, date: '20th', type: 'expense' }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('amarTakaData_v3')) || DEMO_DATA;

        function saveData() {
            localStorage.setItem('amarTakaData_v3', JSON.stringify(appData));
            renderAll();
        }

        function resetData() {
            if(confirm("Reset to demo data? This will clear your changes.")) {
                appData = JSON.parse(JSON.stringify(DEMO_DATA)); // Deep copy
                saveData();
            }
        }

        // --- Theme Management ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;

        // Check local storage for theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
            htmlEl.classList.remove('light');
        } else {
            htmlEl.classList.remove('dark');
            htmlEl.classList.add('light');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
                localStorage.setItem('theme', 'dark');
            }
            // Force re-render to fix chart/list colors if any dynamic js needs it
        });

        // --- DOM Elements ---
        const els = {
            totalBalance: document.getElementById('total-balance'),
            totalIncome: document.getElementById('total-income'),
            totalExpense: document.getElementById('total-expense'),
            walletList: document.getElementById('wallet-list'),
            recentList: document.getElementById('recent-transactions-list'),
            allList: document.getElementById('all-transactions-list'),
            transactionForm: document.getElementById('transaction-form'),
            walletSelect: document.getElementById('transaction-wallet'),
            categorySelect: document.getElementById('transaction-category'),
            manageCategoriesList: document.getElementById('categories-list-manage'),
            manageWalletsList: document.getElementById('wallets-list-manage'),
            recurringList: document.getElementById('recurring-payments-list'),
            tabs: document.querySelectorAll('.tab-btn'),
            contents: document.querySelectorAll('.tab-content'),
            fab: document.getElementById('fab-main'),
            overlay: document.getElementById('modal-overlay'),
            typeSheet: document.getElementById('type-selector-sheet'),
            transactionSheet: document.getElementById('transaction-sheet'),
            catsModal: document.getElementById('categories-modal'),
            walletsModal: document.getElementById('wallets-modal'),
            dateInput: document.getElementById('transaction-date'),
            searchInput: document.getElementById('search-input'),
            txCount: document.getElementById('tx-count')
        };

        // --- Core Logic ---

        function calculateTotals() {
            let total = 0, income = 0, expense = 0;
            const walletBalances = {};
            
            // Initialize wallets with 0
            appData.wallets.forEach(w => walletBalances[w] = 0);

            appData.transactions.forEach(t => {
                const amt = parseFloat(t.amount);
                if (t.type === 'income') {
                    income += amt;
                    total += amt;
                    if (walletBalances[t.wallet] !== undefined) walletBalances[t.wallet] += amt;
                } else {
                    expense += amt;
                    total -= amt;
                    if (walletBalances[t.wallet] !== undefined) walletBalances[t.wallet] -= amt;
                }
            });

            return { total, income, expense, walletBalances };
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        }

        // --- Rendering ---

        function renderDashboard() {
            const stats = calculateTotals();
            els.totalBalance.innerText = formatCurrency(stats.total);
            els.totalIncome.innerText = "+" + formatCurrency(stats.income);
            els.totalExpense.innerText = "-" + formatCurrency(stats.expense);

            // Render Wallets
            els.walletList.innerHTML = '';
            appData.wallets.forEach(w => {
                const bal = stats.walletBalances[w] || 0;
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-black border-2 border-black dark:border-green-600 p-4 rounded-2xl shadow-neo-sm flex flex-col justify-between hover:bg-green-50 dark:hover:bg-green-900/20 transition-colors cursor-default group';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-sm uppercase truncate w-24 dark:text-green-100" title="${w}">${w}</span>
                        <div class="bg-black dark:bg-green-900 text-white dark:text-green-300 rounded-full p-1 group-hover:scale-110 transition-transform"><i data-lucide="credit-card" class="w-3 h-3"></i></div>
                    </div>
                    <p class="text-xl font-bold tracking-tight dark:text-white ${bal < 0 ? 'text-red-500 dark:text-red-400' : ''}">${formatCurrency(bal)}</p>
                `;
                els.walletList.appendChild(card);
            });

            // Render Recent (Top 3)
            renderTransactionList(els.recentList, appData.transactions.slice().sort((a, b) => b.id - a.id).slice(0, 3));
        }

        function renderTransactions() {
            const searchTerm = els.searchInput.value.toLowerCase();
            const filtered = appData.transactions.filter(t => 
                t.note.toLowerCase().includes(searchTerm) || 
                t.category.toLowerCase().includes(searchTerm) || 
                t.wallet.toLowerCase().includes(searchTerm)
            );
            
            els.txCount.innerText = filtered.length;
            // Render All sorted by newest first
            renderTransactionList(els.allList, filtered.sort((a, b) => b.id - a.id));
        }

        function renderTransactionList(container, list) {
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="border-2 border-black dark:border-green-800 p-6 bg-gray-50 dark:bg-green-900/20 text-center font-bold text-gray-400 dark:text-green-700 border-dashed rounded-2xl flex flex-col items-center gap-2">
                    <i data-lucide="ghost" class="w-8 h-8 opacity-50"></i>
                    NO DATA FOUND
                </div>`;
                lucide.createIcons();
                return;
            }

            list.forEach(t => {
                const el = document.createElement('div');
                el.className = 'bg-white dark:bg-black border-2 border-black dark:border-green-700 p-4 rounded-2xl shadow-neo-sm flex justify-between items-center group hover:bg-gray-50 dark:hover:bg-green-900/20 transition-colors';
                const isInc = t.type === 'income';
                el.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 ${isInc ? 'bg-green-100 text-green-600 dark:bg-green-900 dark:text-green-400' : 'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400'} border-2 border-black dark:border-transparent rounded-xl flex items-center justify-center flex-shrink-0">
                            <i data-lucide="${isInc ? 'arrow-down' : 'arrow-up'}" class="w-5 h-5 stroke-[3]"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-bold truncate dark:text-white">${t.note}</p>
                            <p class="text-xs text-gray-500 dark:text-green-600 font-bold uppercase flex items-center gap-1">
                                <span>${t.category}</span> 
                                <span class="w-1 h-1 bg-gray-400 dark:bg-green-600 rounded-full"></span> 
                                <span>${t.wallet}</span>
                            </p>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="font-bold text-lg ${isInc ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">${isInc ? '+' : '-'}${formatCurrency(t.amount).replace('$','')}</span>
                        <span class="text-xs text-gray-400 dark:text-gray-500 font-bold">${t.date}</span>
                        <button onclick="deleteTransaction(${t.id})" class="text-red-500 dark:text-red-400 text-xs font-bold hover:underline mt-1 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                            <i data-lucide="trash-2" class="w-3 h-3"></i> DELETE
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderSelects() {
            // Wallets Select
            els.walletSelect.innerHTML = '';
            appData.wallets.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = w;
                els.walletSelect.appendChild(opt);
            });

            // Categories Select
            els.categorySelect.innerHTML = '<option value="">Select...</option>';
            appData.categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                els.categorySelect.appendChild(opt);
            });
        }

        function renderManagementLists() {
            // Manage Categories
            els.manageCategoriesList.innerHTML = '';
            appData.categories.forEach(c => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-gray-50 dark:bg-green-900/10 p-3 rounded-xl border-2 border-transparent hover:border-black dark:hover:border-green-500 transition-all dark:text-white';
                item.innerHTML = `
                    <span class="font-bold text-sm">${c}</span>
                    <button onclick="deleteCategory('${c}')" class="bg-red-100 dark:bg-red-900/20 p-2 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                `;
                els.manageCategoriesList.appendChild(item);
            });

            // Manage Wallets
            els.manageWalletsList.innerHTML = '';
            appData.wallets.forEach(w => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-gray-50 dark:bg-green-900/10 p-3 rounded-xl border-2 border-transparent hover:border-black dark:hover:border-green-500 transition-all dark:text-white';
                item.innerHTML = `
                    <span class="font-bold text-sm">${w}</span>
                    <button onclick="deleteWallet('${w}')" class="bg-red-100 dark:bg-red-900/20 p-2 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                `;
                els.manageWalletsList.appendChild(item);
            });

            // Recurring (Settings Tab)
            els.recurringList.innerHTML = '';
            if (!appData.recurring || appData.recurring.length === 0) {
                els.recurringList.innerHTML = `<p class="font-bold text-gray-400 dark:text-green-700 text-center border-2 border-dashed border-gray-300 dark:border-green-800 p-6 rounded-2xl">No fixed payments.</p>`;
            } else {
                appData.recurring.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center bg-white dark:bg-black border-2 border-black dark:border-green-600 p-4 rounded-xl shadow-neo-sm';
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="bg-purple-100 dark:bg-green-900 p-2 rounded-lg border dark:border-green-500">
                                <i data-lucide="repeat" class="w-4 h-4 text-purple-600 dark:text-green-400"></i>
                            </div>
                            <div>
                                <p class="font-bold text-sm dark:text-white">${r.name}</p>
                                <p class="text-xs font-bold text-gray-400 dark:text-green-600">Every ${r.date}</p>
                            </div>
                        </div>
                        <span class="font-bold dark:text-white">$${r.amount}</span>
                    `;
                    els.recurringList.appendChild(div);
                });
            }

            lucide.createIcons();
        }

        function renderAll() {
            renderDashboard();
            renderTransactions();
            renderSelects();
            renderManagementLists();
        }

        // --- Actions ---

        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transaction-type').value;
            const amount = parseFloat(document.getElementById('transaction-amount').value);
            const wallet = document.getElementById('transaction-wallet').value;
            const category = document.getElementById('transaction-category').value;
            const date = document.getElementById('transaction-date').value;
            const note = document.getElementById('transaction-note').value;

            if(!amount || !wallet || !category || !date) return alert("Please fill all fields");

            const newTx = {
                id: Date.now(),
                type, amount, wallet, category, date, note
            };

            appData.transactions.push(newTx);
            saveData();
            closeSheet('transaction-sheet');
            els.transactionForm.reset();
        }

        window.deleteTransaction = function(id) {
            if(confirm('Delete this transaction?')) {
                appData.transactions = appData.transactions.filter(t => t.id !== id);
                saveData();
            }
        };

        // Categories
        document.getElementById('category-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('new-category-input').value.trim();
            if(val && !appData.categories.includes(val)) {
                appData.categories.push(val);
                document.getElementById('new-category-input').value = '';
                saveData();
            }
        });

        window.deleteCategory = function(cat) {
            if(confirm(`Delete category "${cat}"?`)) {
                appData.categories = appData.categories.filter(c => c !== cat);
                saveData();
            }
        }

        // Wallets
        document.getElementById('wallet-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('new-wallet-input').value.trim();
            if(val && !appData.wallets.includes(val)) {
                appData.wallets.push(val);
                document.getElementById('new-wallet-input').value = '';
                saveData();
            }
        });

        window.deleteWallet = function(val) {
            if(confirm(`Delete wallet "${val}"? Transactions linked to this wallet will remain but wallet stats will break.`)) {
                appData.wallets = appData.wallets.filter(w => w !== val);
                saveData();
            }
        }

        // --- Interaction Handlers ---

        // Tabs
        els.tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                els.tabs.forEach(b => {
                    b.classList.remove('active');
                    b.style.backgroundColor = 'transparent';
                    b.style.border = '2px solid transparent';
                    b.style.color = ''; // Reset color
                    if(htmlEl.classList.contains('dark')) {
                        b.style.color = '#4ade80'; // green-400 inactive
                    }
                });
                els.contents.forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                btn.style.backgroundColor = '#4ade80';
                btn.style.border = '2px solid black';
                btn.style.color = 'black';
                document.getElementById(`${btn.dataset.tab}-content`).classList.add('active');
            });
        });

        // Correct tab color on theme switch
        themeToggleBtn.addEventListener('click', () => {
            const activeTab = document.querySelector('.tab-btn.active');
            if(activeTab) {
                activeTab.style.color = 'black'; 
            }
            document.querySelectorAll('.tab-btn:not(.active)').forEach(b => {
                b.style.color = htmlEl.classList.contains('dark') ? '#4ade80' : '';
            });
        });

        // Search Input
        els.searchInput.addEventListener('input', renderTransactions);

        // FAB & Sheets
        els.fab.addEventListener('click', () => openSheet('type-selector-sheet'));
        els.overlay.addEventListener('click', closeAllModals);
        
        document.getElementById('close-selector-handle').addEventListener('click', () => closeSheet('type-selector-sheet'));
        document.getElementById('close-form-btn').addEventListener('click', () => closeSheet('transaction-sheet'));

        document.getElementById('btn-choose-income').addEventListener('click', () => {
            closeSheet('type-selector-sheet');
            openSheet('transaction-sheet', 'income');
        });
        document.getElementById('btn-choose-expense').addEventListener('click', () => {
            closeSheet('type-selector-sheet');
            openSheet('transaction-sheet', 'expense');
        });

        function openSheet(id, type = null) {
            els.overlay.classList.add('open');
            document.getElementById(id).classList.add('open');
            if(type) {
                document.getElementById('transaction-type').value = type;
                document.getElementById('form-title').innerText = type === 'income' ? 'New Income' : 'New Expense';
                document.getElementById('form-title').className = type === 'income' ? 'text-2xl font-bold text-green-600 dark:text-green-400' : 'text-2xl font-bold text-red-600 dark:text-red-400';
                // Set date to today
                els.dateInput.valueAsDate = new Date();
            }
        }

        function closeSheet(id) {
            els.overlay.classList.remove('open');
            document.getElementById(id).classList.remove('open');
        }

        function closeAllModals() {
            els.overlay.classList.remove('open');
            document.querySelectorAll('.slide-sheet').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.modal-scale').forEach(el => el.classList.remove('open'));
        }

        // Modals (Categories & Wallets)
        document.getElementById('manage-categories-btn').addEventListener('click', () => {
            els.overlay.classList.add('open');
            els.catsModal.classList.add('open');
        });
        document.getElementById('close-cats-btn').addEventListener('click', closeAllModals);
        document.getElementById('close-cats-bg').addEventListener('click', closeAllModals);

        document.getElementById('manage-wallets-btn').addEventListener('click', () => {
            els.overlay.classList.add('open');
            els.walletsModal.classList.add('open');
        });
        document.getElementById('close-wallets-btn').addEventListener('click', closeAllModals);
        document.getElementById('close-wallets-bg').addEventListener('click', closeAllModals);

        // Forms
        els.transactionForm.addEventListener('submit', addTransaction);
        document.getElementById('reset-demo-data').addEventListener('click', resetData);

        // Init
        renderAll();
        lucide.createIcons();

        // Initial Theme Check for Tabs
        if(htmlEl.classList.contains('dark')) {
            document.querySelectorAll('.tab-btn:not(.active)').forEach(b => {
                b.style.color = '#4ade80';
            });
        }

    </script>
</body>
</html>
